name: Deploy Deno (staging)

# Deploys the Deno backend (deno/main.ts) to the NEW Deno Deploy using the `deno deploy` CLI
# (built into the Deno runtime) with the DENO_DEPLOY_TOKEN repo secret.
#
# SAFETY: uses `--source local`, uploading ONLY the deno/ directory from THIS branch. It does NOT
# use Deno's GitHub auto-deploy integration, so the `main` branch is NEVER built or deployed.
# Publishes a Deno Deploy app URL isolated from real production (GitHub Pages + Supabase untouched).
# This is NOT a production cutover.
#
# (deployctl was the WRONG tool — that is Deno Deploy *Classic*; org sw-igin is on the NEW Deploy,
# whose token classic deployctl rejected as invalid. The new product uses `deno deploy`.)

on:
  workflow_dispatch:
  push:
    branches:
      - "migration/deno-runtime"

permissions:
  contents: read

jobs:
  deploy-deno:
    name: deno deploy create (local source, never main)
    runs-on: ubuntu-latest
    env:
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
      BIOT_BASE_URL: ${{ secrets.BIOT_BASE_URL }}
      ORG: sw-igin
      APP: biot-dashboard-staging
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deploy (idempotent): ensure app, set env, deploy to production
        id: deploy
        run: |
          set -x
          # 1) Ensure the app exists (LOCAL source → main never involved). Tolerate "already exists"
          #    on re-runs; the real deploy below is what must succeed.
          deno deploy create \
            --token "$DENO_DEPLOY_TOKEN" \
            --org "$ORG" --app "$APP" \
            --source local --region us --entrypoint main.ts deno > create.log 2>&1
          echo "create rc=$? (non-zero is OK if the app already exists)"
          cat create.log || true
          # 2) Ensure the runtime env var is present (idempotent).
          deno deploy env add --token "$DENO_DEPLOY_TOKEN" --org "$ORG" --app "$APP" \
            BIOT_BASE_URL "$BIOT_BASE_URL" > env.log 2>&1 || echo "env add non-zero (already exists is OK)"
          # 3) Deploy to production from LOCAL source. THIS must succeed.
          deno deploy --prod \
            --token "$DENO_DEPLOY_TOKEN" \
            --org "$ORG" --app "$APP" \
            --entrypoint main.ts deno 2>&1 | tee deploy.log
          DEPLOY_RC=${PIPESTATUS[0]}
          [ "$DEPLOY_RC" = 0 ] || { echo "deno deploy --prod FAILED rc=$DEPLOY_RC"; exit 1; }
          # 4) Extract the deployed URL (new Deploy uses .deno.net).
          URL="$(grep -ohE 'https://[a-zA-Z0-9.-]+\.deno\.(net|dev)' deploy.log create.log | grep -vE '\-[a-z0-9]{8,}\.' | sort -u | tail -1)"
          [ -n "$URL" ] || URL="$(grep -ohE 'https://[a-zA-Z0-9.-]+\.deno\.(net|dev)' deploy.log create.log | sort -u | tail -1)"
          echo "Deployed URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          { echo "### Deno Deploy (staging)"; echo "URL: $URL"; echo ""; \
            echo "Local-source deploy of deno/main.ts; main never deployed; production frontend still on Supabase."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test health (retry for first-deploy propagation)
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          [ -n "$URL" ] || { echo "Could not determine deployed URL — see create.log/deploy.log"; exit 1; }
          node scripts/smoke-health.mjs "$URL" --retries 10 --delay 6000
