name: Deploy Worker (staging)

# GUARDED, MANUAL-ONLY in this migration stage.
#
# - Triggered only by manual `workflow_dispatch` (never automatically on push/merge).
# - Deploys to the STAGING Worker only. There is no production target wired up.
# - This is a parallel/preview runtime. It does NOT cut production over to Cloudflare;
#   the frontend still calls the Supabase Edge Function.
#
# Required repository secrets (set in GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  — target Cloudflare account id
#   BIOT_BASE_URL          — BIOT API base URL (pushed to the Worker as a secret)
#
# The job is also bound to the `staging` GitHub Environment so you can add required
# reviewers / protection rules there if desired.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-staging" to confirm a staging deploy'
        required: true
        default: ""
  # Staging-validation convenience (Stage 3): auto-deploy to STAGING on pushes to the
  # migration branch. This is safe — staging-only, there is no production target defined
  # anywhere. It also makes this workflow dispatchable (a workflow_dispatch-only file that
  # has never run on the default branch is not registered for manual dispatch).
  # Revisit before cutover: a production deploy must stay manual + gated.
  push:
    branches:
      - "migration/**"

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Cloudflare (staging)
    # Deploy on: (a) a push to a migration/** branch, or (b) a manual dispatch that typed
    # the confirmation. Any other context skips.
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'deploy-staging' }}
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install worker deps
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Deploy FIRST so the Worker exists before we attach a secret. `wrangler secret
      # put` against a not-yet-deployed Worker fails with script_not_found, so ordering
      # matters on the first-ever deploy. Capture the deployed workers.dev URL.
      - name: Deploy (staging)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env staging | tee deploy.log
          URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "Deployed URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare staging deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker URL: $URL" >> "$GITHUB_STEP_SUMMARY"

      # Setting a secret triggers an automatic re-deploy of the existing code with the
      # secret attached, so BIOT_BASE_URL is live after this step.
      - name: Push BIOT_BASE_URL secret to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BIOT_BASE_URL: ${{ secrets.BIOT_BASE_URL }}
        run: echo "$BIOT_BASE_URL" | npx wrangler secret put BIOT_BASE_URL --env staging

      - name: Smoke-test health endpoint
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then echo "Could not determine deployed URL"; exit 1; fi
          # Give the secret re-deploy a moment to propagate, then assert health ok.
          sleep 5
          node ../../scripts/smoke-health.mjs "$URL"
