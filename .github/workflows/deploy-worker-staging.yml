name: Deploy Worker (staging)

# GUARDED, MANUAL-ONLY in this migration stage.
#
# - Triggered only by manual `workflow_dispatch` (never automatically on push/merge).
# - Deploys to the STAGING Worker only. There is no production target wired up.
# - This is a parallel/preview runtime. It does NOT cut production over to Cloudflare;
#   the frontend still calls the Supabase Edge Function.
#
# Required repository secrets (set in GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  — target Cloudflare account id
#   BIOT_BASE_URL          — BIOT API base URL (pushed to the Worker as a secret)
#
# The job is also bound to the `staging` GitHub Environment so you can add required
# reviewers / protection rules there if desired.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-staging" to confirm a staging deploy'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Cloudflare (staging)
    if: ${{ github.event.inputs.confirm == 'deploy-staging' }}
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install worker deps
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Push BIOT_BASE_URL secret to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BIOT_BASE_URL: ${{ secrets.BIOT_BASE_URL }}
        run: echo "$BIOT_BASE_URL" | npx wrangler secret put BIOT_BASE_URL --env staging

      - name: Deploy (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging

      - name: Smoke-test health endpoint
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploy complete. Run the health smoke test against the deployed URL:"
          echo "  node scripts/smoke-health.mjs https://biot-dashboard-staging.<your-subdomain>.workers.dev"
