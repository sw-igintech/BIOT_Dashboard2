name: Deploy Worker (production)

# PRODUCTION deploy — MANUAL ONLY, DOUBLE-GATED. There is intentionally NO push/PR trigger:
# production can never deploy from a branch push. It can only be started by a human via
# workflow_dispatch, and only after typing the exact confirmation phrase.
#
# Additional protection: this job runs in the `production` GitHub Environment. Configure that
# environment in GitHub → Settings → Environments → production with REQUIRED REVIEWERS so the
# deploy also needs a human approval click before it runs. (Strongly recommended.)
#
# NOTE: deploying the production Worker is NOT the production cutover. Cutover = pointing the
# frontend (index.html) at the production Worker URL — a separate, isolated, reversible change
# (see cloudflare/cutover/CUTOVER.md). This workflow only publishes the backend Worker.
#
# Dispatchability: a workflow_dispatch-only workflow is only dispatchable once its file is on
# the default branch. This file becomes runnable when the migration branch is merged to main
# (which is itself the cutover step) — so production literally cannot be deployed before then.
#
# Required repository secrets (already configured): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# BIOT_BASE_URL.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-production" to confirm a PRODUCTION Worker deploy'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy to Cloudflare (production)
    # Hard gate: only proceed when the confirmation phrase is exact.
    if: ${{ github.event.inputs.confirm == 'deploy-production' }}
    runs-on: ubuntu-latest
    environment: production   # add Required Reviewers here for a manual approval gate
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install worker deps
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Deploy FIRST so the Worker exists before attaching its secret (secret put on a
      # not-yet-deployed Worker fails). Capture the deployed production URL.
      - name: Deploy (production)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env production | tee deploy.log
          URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "Deployed URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare PRODUCTION Worker deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reminder: this publishes the backend only. The frontend cutover is separate." >> "$GITHUB_STEP_SUMMARY"

      - name: Push BIOT_BASE_URL secret to the Worker (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BIOT_BASE_URL: ${{ secrets.BIOT_BASE_URL }}
        run: echo "$BIOT_BASE_URL" | npx wrangler secret put BIOT_BASE_URL --env production

      - name: Smoke-test health endpoint (with retry for first-deploy propagation)
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then echo "Could not determine deployed URL"; exit 1; fi
          node ../../scripts/smoke-health.mjs "$URL" --retries 6 --delay 5000
