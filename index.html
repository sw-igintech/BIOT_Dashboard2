<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>IGIN SMART - IOT</title>
  <script>
    window.DASHBOARD_CONFIG = {
      supabaseEdgeUrl: "https://qjkrkqyycujmjxbfthev.supabase.co/functions/v1/biot-dashboard",
      supabaseAnonKey: "sb_publishable_z7FBfMgMJYiZPfvgYPx_1Q_Q5WbevXJ"
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <link rel="stylesheet" href="./dashboard.css?v=20260427-1" />
  <script src="./dashboard.js?v=20260427-1" defer></script>
</head>
<body>

  <!-- Login view — shown when not authenticated -->
  <div id="loginView" class="login-overlay hidden">
    <div class="login-card">
      <div class="login-logo">
        <!--
          LOGO — to replace: swap the src below with your logo file path.
          File: logo.svg (project root)
          Recommended: SVG or PNG, ideally square, 48–64 px display size.
        -->
        <img src="./logo.svg" alt="IGIN SMART" class="brand-logo" />
        <div class="eyebrow">IGIN SMART</div>
        <h1>IOT</h1>
      </div>
      <form id="loginForm" class="login-form" novalidate>
        <div id="loginError" class="inline-error hidden"></div>
        <label class="field">
          <span>Email</span>
          <input id="loginEmail" type="email" autocomplete="email" autofocus placeholder="your@email.com" />
        </label>
        <div class="field">
          <span>Password</span>
          <div class="password-wrap">
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" />
            <button type="button" id="togglePassword" class="toggle-password-btn">Show</button>
          </div>
        </div>
        <button id="loginBtn" class="primary-button login-submit" type="submit">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Dashboard view — shown when authenticated -->
  <div id="dashboardView" class="app-shell product-shell hidden">
    <main class="main product-main">
      <header class="dashboard-head">
        <div class="brand-bar">
          <!--
            LOGO — to replace: swap the src below with your logo file path.
            File: logo.svg (project root)
          -->
          <img src="./logo.svg" alt="IGIN SMART" class="brand-logo-sm" />
          <div class="dashboard-heading">
            <div class="eyebrow">IGIN SMART</div>
            <h1>IOT</h1>
          </div>
        </div>
        <div class="header-actions">
          <span id="userInfo" class="user-info"></span>
          <button id="logoutBtn" class="ghost-button" type="button">Sign Out</button>
        </div>
      </header>

      <section class="filter-card compact-filters">
        <div class="filter-grid product-filter-grid">
          <div class="field">
            <span>From</span>
            <div class="datetime-row">
              <input id="fromDate" type="text" inputmode="numeric" placeholder="dd/mm/yy" maxlength="8" class="date-input" autocomplete="off" />
              <input id="fromTime" type="time" value="00:00" class="time-input" />
            </div>
          </div>

          <div class="field">
            <span>To</span>
            <div class="datetime-row">
              <input id="toDate" type="text" inputmode="numeric" placeholder="dd/mm/yy" maxlength="8" class="date-input" autocomplete="off" />
              <input id="toTime" type="time" value="23:59" class="time-input" />
            </div>
          </div>

          <label id="organizationField" class="field hidden">
            <span>Organization</span>
            <select id="organizationSelect"></select>
          </label>

          <div class="filter-actions">
            <button id="refreshBtn" class="primary-button" type="button">Refresh</button>
          </div>
        </div>
      </section>

      <div id="dashboardError" class="inline-error hidden"></div>
      <div id="dashboardLoading" class="loading-strip hidden">Refreshing dashboard...</div>

      <section class="card-grid">
        <article class="card chart-card">
          <div class="card-header simple-card-header">
            <h3>Device Connection Status</h3>
          </div>

          <div id="connectionMetrics" class="metric-grid"></div>

          <div class="chart-layout">
            <div class="chart-area">
              <canvas id="connectionChart" aria-label="Device connection status chart"></canvas>
            </div>
            <div id="connectionLegend" class="legend"></div>
          </div>
        </article>

        <article class="card chart-card">
          <div class="card-header simple-card-header">
            <h3>Glove Consumption</h3>
          </div>

          <div id="gloveMetrics" class="metric-grid"></div>

          <div class="chart-layout">
            <div class="chart-area">
              <canvas id="gloveChart" aria-label="Glove consumption chart"></canvas>
            </div>
            <div id="gloveLegend" class="legend"></div>
          </div>
        </article>

        <article class="card chart-card">
          <div class="card-header simple-card-header">
            <h3>Sanitizer Status</h3>
          </div>

          <div id="sanitizerMetrics" class="metric-grid"></div>

          <div class="chart-layout">
            <div class="chart-area">
              <canvas id="sanitizerChart" aria-label="Sanitizer status chart"></canvas>
            </div>
            <div id="sanitizerLegend" class="legend"></div>
          </div>
        </article>
      </section>

      <section class="table-grid">
        <article class="card table-card">
          <div class="card-header">
            <div>
              <h3>Offline Devices</h3>
            </div>
            <div id="offlineCount" class="count-badge">0</div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Last Connected At</th>
                  <th>Connected</th>
                </tr>
              </thead>
              <tbody id="offlineTableBody"></tbody>
            </table>
          </div>

          <div id="offlineEmpty" class="empty-state hidden">
            No disconnected devices found.
          </div>
        </article>

        <article class="card table-card">
          <div class="card-header">
            <div>
              <h3>Sanitizer Devices</h3>
            </div>
            <div id="sanitizerCount" class="count-badge">0</div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Sanitizer Status</th>
                </tr>
              </thead>
              <tbody id="sanitizerTableBody"></tbody>
            </table>
          </div>

          <div id="sanitizerEmpty" class="empty-state hidden">
            No sanitizer devices found.
          </div>
        </article>
      </section>
    </main>
  </div>

</body>
</html>
