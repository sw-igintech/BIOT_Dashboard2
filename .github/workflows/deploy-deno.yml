name: Deploy Deno backend (production)

# PRODUCTION backend deploy. Since the 2026-06-18 cutover, `main` is production and the Deno Deploy
# app `biot-dashboard-staging` (URL https://biot-dashboard-staging.sw-igin.deno.net) is the live
# backend the GitHub Pages frontend calls.
#
# Deploys deno/main.ts via the `deno deploy` CLI with `--source local` (uploads only the deno/
# directory from the checked-out ref) and the DENO_DEPLOY_TOKEN repo secret.
#
# SAFETY:
#  - Triggers ONLY from `main` (push to main touching deno/**, or a manual dispatch). The job has a
#    hard `if: github.ref == 'refs/heads/main'` guard, so a dispatch on any other branch is a no-op
#    — production can never be deployed from the wrong branch.
#  - A `deno check` gate must pass before deploying, so broken code can't ship.
#  - Rollback for the backend = re-run this on a reverted main, or redeploy a previous revision from
#    the Deno dashboard. Frontend rollback is independent (`git revert` the cutover commit).

on:
  push:
    branches: [main]
    paths:
      - "deno/**"
      - ".github/workflows/deploy-deno.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-deno:
    name: deno deploy --prod (main only)
    # Hard guard: production deploys only from main (covers manual dispatch on a wrong branch too).
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
      BIOT_BASE_URL: ${{ secrets.BIOT_BASE_URL }}
      ORG: sw-igin
      APP: biot-dashboard-staging
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck gate (deno check)
        run: deno check deno/main.ts

      - name: "Deploy deno/main.ts to production"
        id: deploy
        run: |
          # 1) Ensure the runtime env var is present (idempotent).
          deno deploy env add --token "$DENO_DEPLOY_TOKEN" --org "$ORG" --app "$APP" \
            BIOT_BASE_URL "$BIOT_BASE_URL" > env.log 2>&1 || echo "env add non-zero (already exists is OK)"
          # 2) Deploy to production from LOCAL source (root-path = deno/; entrypoint auto-detected
          #    from deno/main.ts — the top-level `deno deploy` has no --entrypoint flag). Must succeed.
          deno deploy --prod \
            --token "$DENO_DEPLOY_TOKEN" \
            --org "$ORG" --app "$APP" \
            deno 2>&1 | tee deploy.log
          DEPLOY_RC=${PIPESTATUS[0]}
          [ "$DEPLOY_RC" = 0 ] || { echo "deno deploy --prod FAILED rc=$DEPLOY_RC"; exit 1; }
          # 3) Extract the deployed URL (prefer the stable production URL, not the hashed preview).
          URL="$(grep -ohE 'https://[a-zA-Z0-9.-]+\.deno\.(net|dev)' deploy.log | grep -vE '\-[a-z0-9]{8,}\.' | sort -u | tail -1)"
          [ -n "$URL" ] || URL="$(grep -ohE 'https://[a-zA-Z0-9.-]+\.deno\.(net|dev)' deploy.log | sort -u | tail -1)"
          echo "Deployed URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          { echo "### Deno backend (production) deployed"; echo "URL: $URL"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test health (retry for propagation)
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          [ -n "$URL" ] || { echo "Could not determine deployed URL — see deploy.log"; exit 1; }
          node scripts/smoke-health.mjs "$URL" --retries 10 --delay 6000
