# Cloudflare Worker config — biot-dashboard (PARALLEL MIGRATION TARGET)
#
# This deploys the BIOT proxy Worker that mirrors the active Supabase Edge Function.
# It is NOT the production backend yet — the frontend still points at Supabase.
# Deploy this to a preview/staging Worker URL for validation only.
#
# Required runtime config:
#   BIOT_BASE_URL — the BIOT API base URL.
#     For a non-secret host value you may keep it in [vars] below, or (preferred for
#     parity with the current "secret"-style handling) set it out-of-band with:
#         wrangler secret put BIOT_BASE_URL
#     A [vars] value and a secret of the same name cannot both be set — pick one.
#
# Deploy (manual, staging):
#   cd cloudflare/worker
#   npm install
#   npx wrangler deploy            # uses the top-level (staging) name below
#
# Local dev:
#   npx wrangler dev               # reads .dev.vars (see .dev.vars.example)

name = "biot-dashboard-staging"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Observability: keep logs on for the validation phase.
[observability]
enabled = true

# BIOT base URL. Commented out by default so it does not collide with a
# `wrangler secret put BIOT_BASE_URL`. Uncomment ONLY if you prefer plaintext vars.
# [vars]
# BIOT_BASE_URL = "https://api.dev.igin.biot-med.com"

# ---------------------------------------------------------------------------
# Named environments
# ---------------------------------------------------------------------------
# Two isolated environments. Each is a separate Worker with its own secrets:
#   staging    → biot-dashboard-staging.sw-590.workers.dev   (validated, in use)
#   production → biot-dashboard-prod.sw-590.workers.dev       (config ready; NOT yet deployed)
#
# IMPORTANT: defining [env.production] here does NOT cut production over. Cutover only happens
# when the production frontend (index.html) is pointed at the production Worker URL — that is a
# separate, isolated, gated step (see cloudflare/cutover/CUTOVER.md). Deploying the production
# Worker is done only via the manual, gated `Deploy Worker (production)` GitHub workflow.
[env.staging]
name = "biot-dashboard-staging"

[env.production]
name = "biot-dashboard-prod"
# Default address: https://biot-dashboard-prod.sw-590.workers.dev (workers.dev).
# OPTIONAL custom domain/route (requires a Cloudflare-managed zone). Leave commented unless a
# custom domain is chosen at cutover time; if enabled, update the cutover URL accordingly.
# routes = [
#   { pattern = "dashboard-api.example.com", custom_domain = true }
# ]
